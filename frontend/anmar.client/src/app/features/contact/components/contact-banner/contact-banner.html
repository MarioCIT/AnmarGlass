<header class="contact-banner">
  <picture class="contact-banner-picture">
    <source media="(min-width: 1024px)" srcset="/assets/images/contact-banner-placeholder-1.webp" type="image/webp">
    <img 
      src="/assets/images/contact-banner-placeholder-1.webp" 
      alt="" 
      aria-hidden="true"
      width="1920" 
      height="200"
      fetchpriority="high"
      loading="eager"
      class="contact-banner-img"
    />
  </picture>

  <!-- Centered Content Overlay -->
  <div class="contact-banner-content">
    <h1 class="contact-title">Contact Our Team</h1>
    <p class="contact-subtitle">Have questions about our enterprise solutions? We're here to help.</p>
  </div>
</header>
